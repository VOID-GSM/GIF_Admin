name: GIF Admin CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Node.js ${{ matrix.node-version }} 설정
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 코드 검사
        run: npm run lint --if-present

      - name: Next.js 빌드
        run: npm run build --if-present

      - name: GIF_ADMIN CI Discord Notification (success)
        if: ${{ success() }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD }}
          title: '✅ GIF_ADMIN CI Success! ✅'
          status: ${{ job.status }}
          description: 'GIF Admin 빌드 성공'
          color: 65280
          url: 'https://github.com/sarisia/actions-status-discord'
          username: 'GIF-ADMIN-bot'

      - name: GIF_ADMIN CI Discord Notification (failure)
        if: ${{ failure() }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD }}
          title: '❗️ GIF_ADMIN CI Fail! ❗️'
          status: ${{ job.status }}
          description: 'GIF Admin 빌드 실패'
          color: 16711680
          url: 'https://github.com/sarisia/actions-status-discord'
          username: 'GIF-ADMIN-bot'